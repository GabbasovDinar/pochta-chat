<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Pochta-Chat SPA</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery (для манипуляций с DOM) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS Bundle (с Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Подключение конфигурационного файла и основного JS -->
  <script src="config.js"></script>
  <script>
    // Создаем тег script для api.js с добавлением текущей временной метки,
    // чтобы браузер всегда загружал свежую версию файла.
    var script = document.createElement("script");
    // Получаем текущую временную метку в миллисекундах
    var timestamp = new Date().getTime();
    script.src = "api.js?v=" + timestamp;
    document.head.appendChild(script);
  </script>
  </body>
  <link rel="stylesheet" href="style.css?123"></link>
</head>
<body>
  <div class="container">
    <!-- Кнопка проверки соединения (маленькая в левом верхнем углу) -->
    <button class="btn btn-primary" id="checkConnectionBtn">Проверить соединение</button>

    <!-- Login Page -->
    <div id="loginPage">
      <h2>Вход</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label for="loginUsername" class="form-label">Email пользователя</label>
          <input type="text" class="form-control" id="loginUsername" required>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Пароль</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>
      <p class="mt-3">Нет аккаунта? <a href="#" id="showRegisterLink">Зарегистрируйтесь</a></p>
    </div>

    <!-- Registration Page -->
    <div id="registerPage" class="hidden">
      <h2>Регистрация</h2>
      <form id="registerForm">
        <div class="mb-3">
          <label for="registerUsername" class="form-label">Имя пользователя</label>
          <input type="text" class="form-control" id="registerUsername" required>
        </div>
        <div class="mb-3">
          <label for="registerEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="registerEmail" required>
        </div>
        <div class="mb-3">
          <label for="registerPassword" class="form-label">Пароль</label>
          <input type="password" class="form-control" id="registerPassword" required>
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>
      <p class="mt-3">Уже есть аккаунт? <a href="#" id="showLoginLink">Войти</a></p>
    </div>

    <!-- Main Page -->
    <div id="mainPage" class="hidden">
      <!-- Кнопка "Выйти" в правом верхнем углу -->
      <div id="logout">
        <button class="btn btn-danger" id="logoutBtn">Выйти</button>
      </div>
      <!-- Кнопка "Создать групповой чат" -->
      <button class="btn btn-success mb-3" id="createGroupChatBtn">Создать групповой чат</button>
      <h1>Привет, <span id="userName"></span>!</h1>
      <!-- Navigation tabs -->
      <ul class="nav nav-tabs" id="mainTabs" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" id="users-tab" data-bs-toggle="tab" href="#users" role="tab">Пользователи</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="all-chats-tab" data-bs-toggle="tab" href="#all-chats" role="tab">Чаты</a>
        </li>
      </ul>
      <div class="tab-content" id="tabContent" style="margin-top: 20px;">
        <!-- Пользователи -->
        <div class="tab-pane fade show active" id="users" role="tabpanel">
          <div id="usersList"></div>
        </div>
        <!-- Чаты -->
        <div class="tab-pane fade" id="all-chats" role="tabpanel">
          <div id="chatsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно чата -->
  <div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="chatModalLabel">Чат</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div id="chatWindow"></div>
          <textarea class="form-control" id="modalMessageInput" rows="4" placeholder="Введите сообщение"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть чат</button>
          <button type="button" class="btn btn-primary" id="modalSendMessageBtn">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно для создания группового чата -->
    <div class="modal fade" id="groupChatModal" tabindex="-1" aria-labelledby="groupChatModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
           <div class="modal-header">
             <h5 class="modal-title" id="groupChatModalLabel">Создать групповой чат</h5>
             <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
           </div>
           <div class="modal-body">
             <div class="mb-3">
               <label for="groupChatName" class="form-label">Название чата</label>
               <input type="text" class="form-control" id="groupChatName" placeholder="Введите название чата">
             </div>
             <div>
               <h6>Выберите участников:</h6>
               <div id="groupChatUsersList">
                 <!-- Здесь динамически будет выводиться список пользователей с чекбоксами -->
               </div>
             </div>
           </div>
           <div class="modal-footer">
             <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
             <button type="button" class="btn btn-primary" id="createGroupChatConfirmBtn">Создать чат</button>
           </div>
        </div>
      </div>
    </div>
</html>
